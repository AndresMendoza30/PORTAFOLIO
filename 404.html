<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Función no encontrada — Andrés Mendoza</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; display:grid; place-items:center; padding:40px 24px; text-align:center;
    background:#100E0C; color:#F3EEE4; font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  .n{ font-family:"Bodoni Moda",Georgia,serif; font-size:clamp(4.5rem,16vw,9rem); line-height:1; color:#E4A93F; }
  h1{ font-family:"Bodoni Moda",Georgia,serif; font-weight:400; font-size:clamp(1.4rem,4vw,2.2rem); margin-block:14px 12px; }
  p{ color:#A2988A; font-size:.85rem; letter-spacing:.06em; max-width:44ch; margin-inline:auto; line-height:1.7; }
  a{
    display:inline-block; margin-top:28px; text-decoration:none; color:#14100A; background:#E4A93F;
    padding:13px 22px; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
  }
  a:hover{ transform:translateY(-2px); }
  a:focus-visible{ outline:2px solid #F3EEE4; outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <p class="n">404</p>
    <h1>Esta función ya no está en cartelera.</h1>
    <p>La página que buscas se movió o nunca existió. Vuelve al portafolio y échale un ojo a los proyectos que sí están proyectándose.</p>
    <a href="/PORTAFOLIO/">Volver al portafolio</a>
  </main>
</body>
</html>
