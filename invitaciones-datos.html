<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de tu invitación</title>
<meta name="description" content="Formulario para enviar los datos de tu invitación digital.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1B22">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#1B1B22; --fondo-2:#23232C; --luz:#F4F1EC; --tenue:#A5A2AC;
    --oro:#D7B26B; --linea:rgba(244,241,236,.13);
    --display:"Fraunces",Georgia,serif; --texto:"Jost","Segoe UI",Helvetica,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--fondo); color:var(--luz); font-family:var(--texto);
    font-weight:300; font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  h1,h2{ font-family:var(--display); font-weight:400; }
  a{ color:var(--oro); }
  button{ font:inherit; cursor:pointer; }
  .wrap{ max-width:620px; margin-inline:auto; padding-inline:22px; }
  :focus-visible{ outline:2px solid var(--oro); outline-offset:3px; }

  header{ background:var(--fondo-2); border-bottom:1px solid var(--linea); padding-block:30px 32px; margin-bottom:34px; }
  header p.filete{ font-size:.66rem; letter-spacing:.28em; text-transform:uppercase; color:var(--oro); }
  header h1{ font-size:clamp(1.7rem,1.2rem + 2vw,2.4rem); line-height:1.12; margin-block:10px 10px; }
  header p.sub{ color:var(--tenue); font-size:.96rem; }

  fieldset{ border:1px solid var(--linea); padding:22px 20px 24px; margin-bottom:20px; }
  legend{ font-family:var(--display); font-size:1.15rem; padding-inline:10px; color:var(--oro); }
  .campos{ display:grid; gap:14px; }
  label{ display:flex; flex-direction:column; gap:6px; font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:var(--tenue); }
  input, select, textarea{
    background:var(--fondo-2); border:1px solid var(--linea); color:var(--luz);
    font-family:var(--texto); font-weight:300; font-size:1rem; padding:13px 14px;
    letter-spacing:normal; text-transform:none;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--oro); }
  textarea{ min-height:90px; resize:vertical; }
  .ayuda{ font-size:.8rem; color:var(--tenue); letter-spacing:normal; text-transform:none; }
  .dos{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .dos{ grid-template-columns:1fr; } }

  .btn{
    width:100%; background:var(--oro); border:0; color:#20180B;
    font-weight:600; font-size:1rem; padding:17px; margin-top:6px;
    transition:transform .18s ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .aviso{ font-size:.84rem; color:var(--tenue); margin-top:14px; text-align:center; }
  .listo{
    display:none; border:1px solid var(--oro); background:rgba(215,178,107,.10);
    padding:18px; margin-top:18px; font-size:.94rem;
  }
  .listo.show{ display:block; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="filete">Paso 2 de 3</p>
    <h1>Cuéntame de tu evento</h1>
    <p class="sub">Llénalo con calma, son unos 5 minutos. Con esto armo tu invitación y en 2 días te mando el link.</p>
  </div>
</header>

<div class="wrap">
  <form id="form">

    <fieldset>
      <legend>Tus datos</legend>
      <div class="campos">
        <label>Tu nombre
          <input type="text" name="cliente" required placeholder="Quien me está contratando">
        </label>
        <label>Tu WhatsApp
          <input type="tel" name="whats" required placeholder="10 dígitos, para entregarte ahí">
        </label>
        <label>Tipo de evento
          <select name="tipo">
            <option>XV años</option>
            <option>Boda</option>
            <option>Bautizo</option>
            <option>Cumpleaños</option>
            <option>Otro</option>
          </select>
        </label>
        <label>Paquete que elegiste
          <select name="paquete">
            <option>Sencilla — $650</option>
            <option selected>Completa — $1,100</option>
            <option>Premium — $1,600</option>
          </select>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>El evento</legend>
      <div class="campos">
        <label>Nombre de quien festeja
          <input type="text" name="festejado" required placeholder="Ej. Valentina · Ana y Diego · Emiliano">
        </label>
        <div class="dos">
          <label>Fecha del evento
            <input type="date" name="fecha" required>
          </label>
          <label>Hora de inicio
            <input type="time" name="hora">
          </label>
        </div>
        <label>Frase o verso de la invitación
          <textarea name="verso" placeholder="Si tienes una frase que quieras que aparezca. Si no, yo te propongo una."></textarea>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Lugares</legend>
      <div class="campos">
        <label>Misa o ceremonia
          <input type="text" name="ceremonia" placeholder="Nombre del templo y dirección. Si no hay, déjalo vacío">
        </label>
        <label>Recepción o fiesta
          <input type="text" name="recepcion" placeholder="Nombre del salón y dirección completa">
        </label>
        <label>Itinerario
          <textarea name="itinerario" placeholder="Ej. 17:00 misa · 19:00 recepción · 20:30 vals · 21:00 cena"></textarea>
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Familia y detalles</legend>
      <div class="campos">
        <label>Padres
          <input type="text" name="padres" placeholder="Nombres completos, como quieres que aparezcan">
        </label>
        <label>Padrinos
          <input type="text" name="padrinos" placeholder="Opcional">
        </label>
        <div class="dos">
          <label>Código de vestimenta
            <input type="text" name="vestimenta" placeholder="Ej. Formal, sin color rosa">
          </label>
          <label>Mesa de regalos
            <input type="text" name="regalos" placeholder="Ej. Liverpool 51204873">
          </label>
        </div>
        <label>¿Niños?
          <select name="ninos">
            <option>Sí, bienvenidos</option>
            <option>No, solo adultos</option>
            <option>No aplica</option>
          </select>
        </label>
        <label>Colores que quieres
          <input type="text" name="colores" placeholder="Ej. vino y dorado · o mándame foto de la papelería">
        </label>
        <label>¿A qué WhatsApp deben llegar las confirmaciones?
          <input type="tel" name="whatsConfirma" placeholder="Puede ser el tuyo o el de tu mamá">
        </label>
        <label>Algo más que deba saber
          <textarea name="extra" placeholder="Transporte, hospedaje, estacionamiento, lo que sea"></textarea>
        </label>
      </div>
    </fieldset>

    <button class="btn" type="submit">Enviar mis datos</button>
    <p class="aviso">Las fotos me las mandas por WhatsApp después de enviar esto.</p>
    <p class="listo" id="listo"></p>
  </form>
</div>

<script>
  // Los datos se mandan por WhatsApp, así quedan en la conversación con el cliente.
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const d = new FormData(e.target);
    const linea = (etiqueta, valor) => valor && String(valor).trim() ? etiqueta + ": " + String(valor).trim() + "\n" : "";

    const texto =
      "DATOS PARA MI INVITACIÓN\n\n" +
      linea("Cliente", d.get("cliente")) +
      linea("WhatsApp", d.get("whats")) +
      linea("Tipo", d.get("tipo")) +
      linea("Paquete", d.get("paquete")) +
      "\n— EVENTO —\n" +
      linea("Festejado", d.get("festejado")) +
      linea("Fecha", d.get("fecha")) +
      linea("Hora", d.get("hora")) +
      linea("Verso", d.get("verso")) +
      "\n— LUGARES —\n" +
      linea("Ceremonia", d.get("ceremonia")) +
      linea("Recepción", d.get("recepcion")) +
      linea("Itinerario", d.get("itinerario")) +
      "\n— DETALLES —\n" +
      linea("Padres", d.get("padres")) +
      linea("Padrinos", d.get("padrinos")) +
      linea("Vestimenta", d.get("vestimenta")) +
      linea("Mesa de regalos", d.get("regalos")) +
      linea("Niños", d.get("ninos")) +
      linea("Colores", d.get("colores")) +
      linea("Confirmaciones al", d.get("whatsConfirma")) +
      linea("Extra", d.get("extra"));

    window.open("https://wa.me/529514418403?text=" + encodeURIComponent(texto), "_blank", "noopener");

    const listo = document.getElementById("listo");
    listo.textContent = "Listo. Se abrió WhatsApp con tus datos: solo dale enviar. Si no se abrió, escríbeme al 951 441 8403 y te ayudo.";
    listo.classList.add("show");
  });
</script>
</body>
</html>
